# Throwaway local cluster for scripts/kind-smoke.sh: 1 control plane + 1 worker, enough for
# the HPA's two replicas, topology spread and the PodDisruptionBudget to mean something.
# kindnet enforces NetworkPolicies (kind >= 0.24) where the host kernel supports it.
# kube-proxy runs in nftables mode (also works on kernels without the xt_statistic module).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  kubeProxyMode: nftables
nodes:
  - role: control-plane
  - role: worker
