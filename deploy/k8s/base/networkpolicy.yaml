# Default deny for the namespace, then one explicit allow: the ingress controller and
# Prometheus may reach the HTTP port. The app makes no outbound calls at all, so there is no
# egress allow (not even DNS): a compromised pod cannot reach anything.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platewise-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platewise
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: http
          protocol: TCP
