apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-smoke-client
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platewise
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platewise-smoke
          podSelector:
            matchLabels:
              platewise.dev/smoke-client: "true"
      ports:
        - port: http
          protocol: TCP
