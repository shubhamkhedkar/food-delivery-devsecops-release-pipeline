# Local demo stack: Platewise + Prometheus + Grafana. Everything binds to 127.0.0.1.
#   cp .env.example .env   # then fill both values with: openssl rand -hex 32
#   docker compose up -d --build
name: platewise

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  platewise:
    <<: *hardened
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-local}
    image: platewise:local
    environment:
      ORDER_SIGNING_KEY: ${ORDER_SIGNING_KEY:?set ORDER_SIGNING_KEY (32+ random bytes, see .env.example)}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
    ports: ["127.0.0.1:8080:8080"]
    mem_limit: 256m
    pids_limit: 128

  prometheus:
    <<: *hardened
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [platewise]

  grafana:
    <<: *hardened
    image: grafana/grafana:13.2.6@sha256:b21409d7951ddcfd63a4b49083e4ef2cc35bc1437d071813bf82bfb238b00bca
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD (no default credentials)}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    tmpfs: [/tmp]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

volumes:
  prometheus-data:
  grafana-data:
